    <!-- Google tag (gtag.js) - GA4 with Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FB4BL9NSF6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Consent Mode v2 defaults — must be set before gtag('config')
      // Veritas uses no tracking cookies beyond GA4; localStorage auth only.
      // Grant analytics consent by default. If a cookie consent banner is
      // added in the future, update these defaults to 'denied' and call
      // gtag('consent', 'update', {...}) when the user grants consent.
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'granted',
        'security_storage': 'granted'
      });

      gtag('js', new Date());
      gtag('config', 'G-FB4BL9NSF6', {
        'send_page_view': true,
        'cookie_flags': 'SameSite=None;Secure'
      });
    </script>
