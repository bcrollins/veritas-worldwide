<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Citation card template">
  <rect width="1080" height="1080" fill="#FAF8F5"/>
  <rect x="0" y="0" width="1080" height="8" fill="#8B1A1A"/>
  <rect x="0" y="1072" width="1080" height="8" fill="#8B1A1A"/>
  <text x="80" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#8B1A1A">CITATION · THE RECORD</text>
  <text x="80" y="280" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1A1A1A">[Document / filing title]</text>
  <text x="80" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#666666">Source: [agency / court / archive]</text>
  <text x="80" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#666666">Date: [YYYY-MM-DD] · Access: [YYYY-MM-DD]</text>
  <text x="80" y="480" font-family="JetBrains Mono, Courier New, monospace" font-size="18" fill="#1A1A1A">URL / pin: [primary source or archive pin]</text>
  <rect x="80" y="560" width="200" height="44" rx="4" fill="#166534"/>
  <text x="180" y="590" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#FFFFFF">VERIFIED</text>
  <text x="80" y="700" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#666666">Primary sources. Public record. Your conclusions.</text>
  <text x="80" y="980" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#666666">veritasworldwide.com</text>
</svg>
