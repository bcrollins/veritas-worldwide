<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Brand do and don't guide">
  <rect width="1600" height="900" fill="#FAF8F5"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8B1A1A"/>
  <text x="80" y="80" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1A1A1A">Logo usage — Do / Don't</text>
  <text x="80" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#666666">Veritas Worldwide Press · Brand kit v2.8.0</text>
  <rect x="80" y="180" width="680" height="620" fill="#fff" stroke="#d4cfc6" stroke-width="1"/>
  <text x="110" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1B7A3D">DO</text>
  <circle cx="220" cy="380" r="70" fill="none" stroke="#8B1A1A" stroke-width="5"/>
  <text x="220" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1A1A1A">V</text>
  <text x="110" y="520" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Preserve seal proportions</text>
  <text x="110" y="560" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Use brand tokens only</text>
  <text x="110" y="600" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Clear space = V serif height</text>
  <text x="110" y="640" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Prefer SVG over raster</text>
  <rect x="840" y="180" width="680" height="620" fill="#fff" stroke="#d4cfc6" stroke-width="1"/>
  <text x="870" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8B1A1A">DON'T</text>
  <ellipse cx="980" cy="380" rx="100" ry="50" fill="none" stroke="#8B1A1A" stroke-width="5" opacity="0.5"/>
  <text x="980" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1A1A1A" opacity="0.4" transform="rotate(-12 980 380)">V</text>
  <text x="870" y="520" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Stretch or skew the seal</text>
  <text x="870" y="560" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Recolor outside tokens</text>
  <text x="870" y="600" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Drop shadows / neon effects</text>
  <text x="870" y="640" font-family="Georgia, serif" font-size="18" fill="#1A1A1A">Busy photo without scrim</text>
</svg>
