<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CMB angular power spectrum — schematic</title>
  <desc id="desc">Schematic of CMB temperature power spectrum with acoustic peaks. Not observational data; educational figure for The Record of Jesus Christ cosmology section. Veritas Worldwide.</desc>
  <rect width="960" height="540" fill="#FAF8F5"/>
  <text x="40" y="40" font-family="Georgia, serif" font-size="22" fill="#8B1A1A" font-weight="700">CMB angular power spectrum (schematic)</text>
  <text x="40" y="68" font-family="Inter, sans-serif" font-size="13" fill="#666">Educational diagram — not a raw Planck data plot. Peaks constrain baryons, dark matter, and curvature in ΛCDM.</text>
  <!-- axes -->
  <line x1="80" y1="450" x2="900" y2="450" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="80" y1="450" x2="80" y2="100" stroke="#1A1A1A" stroke-width="2"/>
  <text x="460" y="500" font-family="Inter, sans-serif" font-size="14" fill="#333">Multipole moment ℓ (angular scale →)</text>
  <text x="28" y="290" font-family="Inter, sans-serif" font-size="14" fill="#333" transform="rotate(-90 28 290)">Power</text>
  <!-- schematic curve with 3 peaks -->
  <path d="M90 380 C 150 370, 200 200, 260 160 S 340 280, 400 240 S 480 120, 540 150 S 620 300, 700 280 S 800 320, 880 340"
        fill="none" stroke="#8B1A1A" stroke-width="3"/>
  <circle cx="260" cy="160" r="5" fill="#8B1A1A"/>
  <circle cx="540" cy="150" r="5" fill="#8B1A1A"/>
  <circle cx="700" cy="280" r="5" fill="#8B1A1A"/>
  <text x="230" y="145" font-family="Inter, sans-serif" font-size="12" fill="#8B1A1A">1st acoustic peak</text>
  <text x="500" y="135" font-family="Inter, sans-serif" font-size="12" fill="#8B1A1A">2nd</text>
  <text x="670" y="265" font-family="Inter, sans-serif" font-size="12" fill="#8B1A1A">3rd</text>
  <text x="40" y="525" font-family="Inter, sans-serif" font-size="11" fill="#999">Veritas Worldwide · Record of Jesus Christ · Cosmology section · Evidence tier: science_model schematic</text>
</svg>
